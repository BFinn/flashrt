# CI on GitHub's hosted runners (no GPU): the CPU build and its tests; the whole tree with CUDA
# for sm_120, compiled in NVIDIA's CUDA 12.9 container, with the CPU tests of that build; the
# server's unit tests and lints; and the Python and shell tools' lints. The GPU tests (ctest -L gpu)
# run on the target box (README: Tests).
name: ci
on:
  push:
    branches: [main]
  pull_request:

# a newer push supersedes a running check of the same branch (the CUDA build takes a while)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFLASHRT_CUDA=OFF -DFLASHRT_NATIVE=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  cuda:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.9.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build g++
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=120 -DFLASHRT_NATIVE=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -L cpu

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9 shellcheck-py==0.11.0.1
      # the Python and shell tools outside bench/results (those are records of what ran)
      - run: git ls-files '*.py' | grep -v '^bench/results\|^third_party' | xargs ruff check --select F,E9,B,PLE --ignore B905
      - run: git ls-files '*.sh' | grep -v '^bench/results' | xargs shellcheck -S warning

  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87   # stable, 2026-10-01
        with:
          toolchain: stable   # pinned by commit, the action cannot take it from the ref
          components: clippy
      - run: cargo test --release --locked
      - run: cargo clippy --release --all-targets --locked -- -D warnings
