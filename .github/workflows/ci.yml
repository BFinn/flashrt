# CI on GitHub's hosted runners (no GPU): the CPU build and its tests; the whole tree with CUDA
# for sm_120, compiled in NVIDIA's CUDA 12.9 container, with the CPU tests of that build; and the
# server's unit tests and lints. The GPU tests (ctest -L gpu) run on the target box (README: Tests).
name: ci
on:
  push:
    branches: [main]
  pull_request:

# a newer push supersedes a running check of the same branch (the CUDA build takes a while)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFLASHRT_CUDA=OFF -DFLASHRT_NATIVE=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  cuda:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.9.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build g++
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=120 -DFLASHRT_NATIVE=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -L cpu

  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --release --locked
      - run: cargo clippy --release --locked -- -D warnings
